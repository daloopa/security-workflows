name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          AL_VERSION: "1.7.12"
          AL_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          tarball="actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/${tarball}"
          echo "${AL_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c --status
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          actionlint
          shellcheck tests/run.sh tests/stubs/trufflehog tests/stubs/curl
      - name: Test
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml==6.0.2
          RUN_NETWORK_TESTS=1 tests/run.sh
