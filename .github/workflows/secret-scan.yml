# Org-required secret scan (EI-2229). Enforced on every daloopa repo's default
# branch by the org ruleset "Secret scan - TruffleHog" (daloopa-terraform-live,
# github/org-ruleset/). Runs in the TARGET repo's context, so its logs are
# readable by the target's audience — public repos' logs are public. Raw
# TruffleHog output must therefore never reach stdout, stderr or an artifact.
#
# Policy: verified credentials block (exit 1); unverified ones warn. Inline
# `trufflehog:ignore` is honoured but every suppressed VERIFIED finding is
# surfaced to the reviewer. A scan that cannot complete fails as
# "inconclusive" — never read as clean.
name: secret-scan

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          inconclusive() { echo "::error title=Secret scan inconclusive::$1 - this is NOT a finding. Re-run the job; if it persists, ask DevOps."; exit 1; }
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group)  base="$MG_BASE"; head="$MG_HEAD" ;;
            *) inconclusive "unsupported event '$EVENT_NAME'" ;;
          esac
          for sha in "$base" "$head"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || inconclusive "could not resolve the commit range"
          done
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      # Partial clone: full commit graph, blobs fetched on demand for the scanned
      # range only (core-web is 2.1 GB). The on-demand fetch authenticates with the
      # persisted read-only token, so credentials must stay persisted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.range.outputs.head }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Install TruffleHog
        id: install
        env:
          TH_VERSION: "3.99.0"
          TH_SHA256: "e35ae3fd1e4b7a0c1699d0fda1814282bf906d03379bd4337b092b3a84c6740b"
        run: |
          inconclusive() { echo "::error title=Secret scan inconclusive::$1 - this is NOT a finding. Re-run the job; if it persists, ask DevOps."; exit 1; }
          tarball="trufflehog_${TH_VERSION}_linux_amd64.tar.gz"
          dest="$RUNNER_TEMP/trufflehog"
          mkdir -p "$dest"
          curl -fsSL --retry 3 -o "$dest/$tarball" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TH_VERSION}/${tarball}" \
            || inconclusive "download of TruffleHog ${TH_VERSION} failed"
          echo "${TH_SHA256}  $dest/$tarball" | sha256sum -c --status \
            || inconclusive "TruffleHog ${TH_VERSION} checksum mismatch"
          tar -xzf "$dest/$tarball" -C "$dest" trufflehog
          echo "$dest" >> "$GITHUB_PATH"

      - name: Scan
        id: scan
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          # Central path allowlist (EI-2229 DEC-4): one Go regex per line, matched
          # against file paths. Changing it = PR here + new tag + Terraform ref bump.
          # There is deliberately no per-repo exclude file.
          EXCLUDE_PATHS: |
            # (no exclusions yet)
        run: |
          work="$RUNNER_TEMP/secret-scan"
          mkdir -p "$work"
          inconclusive() {
            echo "::error title=Secret scan inconclusive::$1 - this is NOT a finding. Re-run the job; if it persists, ask DevOps."
            printf '## Secret scan: inconclusive\n\n%s - this is not a finding.\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          git rev-parse --verify --quiet "${BASE_SHA}^{commit}" > /dev/null \
            || inconclusive "base commit ${BASE_SHA} is not reachable from the checkout"
          # base.sha is the base branch tip at event time; if it advanced after the branch
          # was cut it is not an ancestor of HEAD. Scan from the merge base so only the
          # PR's own commits are examined.
          since="$(git merge-base "$BASE_SHA" HEAD)" \
            || inconclusive "no merge base between ${BASE_SHA} and the PR head"

          # --trust-local-git-config: scan the checkout in place. Without it TruffleHog
          # clones file:// repos, and cloning this partial clone fails (upload-pack has
          # lazy fetching disabled). Safe here: .git/ was written by actions/checkout,
          # and nothing in the PR's tree can write .git/config.
          common=(git "file://$PWD" --trust-local-git-config --since-commit "$since" --branch HEAD --json --no-update)
          grep -Ev '^[[:space:]]*(#|$)' <<<"$EXCLUDE_PATHS" > "$work/exclude.txt" || true
          if [[ -s "$work/exclude.txt" ]]; then common+=(--exclude-paths "$work/exclude.txt"); fi

          # stderr goes to files that are never printed: TruffleHog's log can carry secret material.
          rc1=0; trufflehog "${common[@]}" --results=verified,unknown > "$work/pass1.ndjson" 2> "$work/pass1.log" || rc1=$?
          rc2=0; trufflehog "${common[@]}" --results=verified --no-ignore-tag > "$work/pass2.ndjson" 2> "$work/pass2.log" || rc2=$?
          [[ $rc1 -eq 0 && $rc2 -eq 0 ]] \
            || inconclusive "TruffleHog exited ${rc1}/${rc2} (its log is withheld: it can contain secret material)"

          cat > "$work/report.jq" <<'JQ'
          # Whitelist: only these fields leave this filter. Raw, RawV2, Redacted, ExtraData,
          # SecretParts, StructuredData and VerificationError are never copied out.
          def norm: {
            detector: (.DetectorName // "unknown-detector" | tostring),
            file:     (.SourceMetadata.Data.Git.file // "" | tostring),
            line:     (.SourceMetadata.Data.Git.line // 1),
            commit:   (.SourceMetadata.Data.Git.commit // "" | tostring | .[0:12]),
            verified: (.Verified == true)
          };
          def key: "\(.detector)|\(.file)|\(.line)|\(.commit)";
          def esc_data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
          def esc_prop: esc_data | gsub(":"; "%3A") | gsub(","; "%2C");
          def md: gsub("\\|"; "\\|") | gsub("\n"; " ");
          def ann($level; $title; $msg):
            "::\($level) file=\(.file | esc_prop),line=\(.line),title=\($title | esc_prop)::\($msg | esc_data)";
          def table($rows):
            if ($rows | length) == 0 then "_none_"
            else (["| Detector | File | Line | Commit |", "|---|---|---|---|"]
                  + ($rows | map("| \(.detector | md) | `\(.file | md)` | \(.line) | `\(.commit)` |"))
                  | join("\n"))
            end;

          ($p1 | map(norm)) as $a
          | ($a | map(key)) as $seen
          | ($a | map(select(.verified)) | unique_by(key)) as $blocking
          | ($a | map(select(.verified | not)) | unique_by(key)) as $unknown
          | ($p2 | map(norm) | map(select(.verified))
             | map(select(key as $k | ($seen | any(. == $k)) | not)) | unique_by(key)) as $suppressed
          | {
              blocking: ($blocking | length),
              annotations: (
                ($blocking | map(ann("error"; "Verified credential (\(.detector))";
                  "A live \(.detector) credential is in commit \(.commit). It is already exposed on this branch: rotate it now, then remove it from the branch history (see daloopa/security-workflows README).")))
                + ($suppressed | map(ann("warning"; "Suppressed verified credential (\(.detector))";
                  "This line carries trufflehog:ignore but the credential is LIVE. Reviewer: approve only if this is intentional.")))
                + ($unknown | map(ann("warning"; "Possible credential (\(.detector))";
                  "Could not be verified, so it does not block. Check whether it is a real credential.")))
              ),
              summary: ([
                "## Secret scan (TruffleHog)", "",
                (if ($blocking | length) > 0
                 then "**Blocked:** \($blocking | length) verified credential(s). Rotate them - removing the line is not enough."
                 else "No verified credentials introduced." end), "",
                "### Verified - blocking (\($blocking | length))", table($blocking), "",
                "### Verified but suppressed with `trufflehog:ignore` (\($suppressed | length))", table($suppressed), "",
                "### Unverified - not blocking (\($unknown | length))", table($unknown)
              ] | join("\n"))
            }
          JQ

          jq -n --slurpfile p1 "$work/pass1.ndjson" --slurpfile p2 "$work/pass2.ndjson" \
            -f "$work/report.jq" > "$work/result.json" 2> /dev/null \
            || inconclusive "could not parse TruffleHog output"
          jq -r '.annotations[]' "$work/result.json"
          jq -r '.summary' "$work/result.json" >> "$GITHUB_STEP_SUMMARY"
          [[ "$(jq '.blocking' "$work/result.json")" -eq 0 ]]
